# tag / type service config, example layer. authentic values go to
# config.0.yaml (git-ignored). account-level config (aws credentials) lives in
# /2026/aws_oa/config/config.yaml + config.0.yaml.
# cognito ids (user pool id, app client id) are not configured here: they are
# read from ../_0_auth_cognito/config_gen.yaml.

# unified name prefix of all aws resource instances of THIS service (tables,
# lambda, api). each service has its own prefix, and resource names terminate
# it with the '--' separator: {prefix}--{resource-name}
# (/doc/aws_oa.md#sub-project-namespace), so '--' must not occur inside the
# prefix itself. style: {user alias}-{time}-{sub-project name}.
name_prefix: alice123-2026-tag-type

tag_type:
  cognito:
    # app client (of _0_auth_cognito user pool) used by clients of this api
    app_client: web
    # group required to access this service at all. resource objects tagged by
    # this service belong to the same platform, so the same access group is
    # reused
    group_access: asset-service
    # group whose members can modify tags/types (others are read-only guest)
    group_admin: admin

  lambda:
    runtime: python3.12
    memory_mb: 256
    # dynamodb plus one local es round trip per write api; the timeout must
    # cover the 20s wait for an index confirmation that never arrives
    timeout_sec: 30
